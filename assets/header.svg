<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img" aria-label="Hey, I'm Maarten. Full-Stack Software Engineer">
  <style>
    .cursor { animation: blink 1.1s steps(1,end) infinite; }
    @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
    .title { font: 700 54px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; fill:#f0f6fc; }
    .role { font: 600 30px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; fill:#58a6ff; }
    .sub { font: 400 19px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; fill:#a8b3c3; }
  </style>
  <text x="24" y="68" class="title">Hey, I'm Maarten.</text>
  <text x="24" y="121" class="role">Full-Stack Software Engineer</text>
  <rect class="cursor" x="420" y="96" width="5" height="31" fill="#58a6ff"/>
  <text x="24" y="168" class="sub">ICT Student at Fontys University of Applied Sciences</text>
</svg>
