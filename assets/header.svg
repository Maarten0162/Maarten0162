    .role { font: 600 30px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; fill:#58a6ff; }
    .sub { font: 400 19px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; fill:#a8b3c3; }
  </style>
  <rect width="1000" height="270" rx="14" fill="#0d1117"/>
  <rect x="1" y="1" width="998" height="268" rx="13" fill="none" stroke="#30363d" stroke-width="2"/>
  <path d="M40 35 H960" stroke="#21262d" stroke-width="1"/>
  <circle cx="55" cy="20" r="5" fill="#f85149"/>
  <circle cx="74" cy="20" r="5" fill="#d29922"/>
